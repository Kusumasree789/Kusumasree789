name: Update Language Percentages

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # every Sunday
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tokei and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y tokei jq

      - name: Generate language percentages
        run: |
          tokei . --output json > tokei.json
          total=$(jq '[.[] | .code] | add' tokei.json)

          echo "## Most Used Languages" > LANGUAGES.md
          echo "" >> LANGUAGES.md
          jq -r --arg total "$total" '
            to_entries |
            sort_by(-.value.code) |
            .[] |
            "\(.key) \(.value.code * 100 / ($total|tonumber))"
          ' tokei.json | while read lang percent; do
            printf "%-12s %6.2f%%\n" "$lang" "$percent" >> LANGUAGES.md
          done

          echo "" >> LANGUAGES.md
          echo "_Updated on $(date '+%Y-%m-%d')_" >> LANGUAGES.md

      - name: Insert into README
        run: |
          if grep -q "## Most Used Languages" README.md; then
            awk '/^## Most Used Languages/,EOF {next} {print}' README.md > TEMP.md
            cat TEMP.md LANGUAGES.md > README.md
          else
            cat LANGUAGES.md >> README.md
          fi

      - name: Commit and push
        run: |
          git config user.name "readme-bot"
          git config user.email "bot@users.noreply.github.com"
          git add README.md
          git commit -m "🔄 Update most used language percentages"
          git push
